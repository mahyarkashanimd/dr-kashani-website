[build]
  publish = "."
  command = "node scripts/seo-audit.mjs"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "/penile-injections-step-by-step"
  to = "/article-injections-step-by-step"
  status = 301
  force = true

[[redirects]]
  from = "/peyronies-xiaflex"
  to = "/article-peyronies"
  status = 301
  force = true

# ---------------------------------------------------------------
# Security headers (applied to every response)
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ---------------------------------------------------------------
# Long-lived caching for fingerprint-stable static assets
# ---------------------------------------------------------------
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"
